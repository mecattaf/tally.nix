[graph]
all-features = true

[advisories]
db-path = "$TALLY_ADVISORY_DB_ROOT"
db-urls = ["https://github.com/RustSec/advisory-db"]
# unmaintained paste via boa =0.21.1; revisit by 2026-12-31 or when Boa >0.21 drops paste
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
