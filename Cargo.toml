[workspace]
resolver = "2"
members = [
  "crates/spec-build-driver",
  "crates/tally-client",
  "crates/tally-core",
  "crates/tally-flow",
  "crates/tally",
]
default-members = [
  "crates/tally-client",
  "crates/tally-core",
  "crates/tally-flow",
  "crates/tally",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Contention arbitration and verifiable execution evidence for systemd-managed work"
repository = "https://github.com/mecattaf/tally.nix"
keywords = ["nix", "systemd", "contention", "provenance", "task-runner"]

[workspace.dependencies]
anyhow = "1.0"
# Keep every Boa sibling on PR #5223's exact paste-to-pastey tree.
boa_ast = { git = "https://github.com/boa-dev/boa.git", rev = "c39e6bf105b3360c80effefde506bf4fb62476eb" }
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "c39e6bf105b3360c80effefde506bf4fb62476eb", default-features = false, features = ["float16", "native-backtrace", "xsum"] }
boa_gc = { git = "https://github.com/boa-dev/boa.git", rev = "c39e6bf105b3360c80effefde506bf4fb62476eb" }
boa_interner = { git = "https://github.com/boa-dev/boa.git", rev = "c39e6bf105b3360c80effefde506bf4fb62476eb" }
boa_parser = { git = "https://github.com/boa-dev/boa.git", rev = "c39e6bf105b3360c80effefde506bf4fb62476eb" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures-lite = "2.6"
getrandom = "0.3"
gethostname = "1.1"
jsonschema = { version = "0.33.0", default-features = false }
libc = "0.2"
proptest = "1"
regex = "1.11"
rust_decimal = { version = "1.37", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# Load-bearing for every canonical payload, catalog, brief, and script identity
# hash: both the flow runner and kernel intentionally preserve JSON member order.
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
serde_json_path = "0.7.2"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }

[profile.release]
lto = "thin"
strip = true
