name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust-smoke:
    name: Rust smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the current tree
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install the Taskwarrior 3 test dependency
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install task
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Restore and save the Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Reject Rust stubs and TODOs
        shell: bash
        run: |
          set -euo pipefail

          set +e
          grep -rn 'todo!\|unimplemented!\|TODO' crates/
          grep_status=$?
          set -e

          if [ "$grep_status" -eq 0 ]; then
            echo "::error title=Rust placeholders found::Remove the matches printed above"
            exit 1
          fi

          if [ "$grep_status" -ne 1 ]; then
            echo "::error title=No-stubs gate failed::grep exited $grep_status"
            exit "$grep_status"
          fi
